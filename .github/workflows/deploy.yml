name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands using password/key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BTS_HOST }}
          username: ${{ secrets.BTS_USERNAME }}
          key: ${{ secrets.BTS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/bela-escala || exit 1
            git pull origin main
            
            # Rebuild Frontend (Visual changes)
            cd infra
            docker compose up -d --build web
            
            # Rebuild API (Schema/Seed changes)
            docker compose up -d --build api
            
            # Run Seed if needed (Optional, usually manual)
            # docker exec bela_escala_api npm run prisma:seed
            
            echo "Deployment successful!"
