version: '3.8'

services:
  # Banco de Dados Principal
  db:
    image: postgres:15-alpine
    container_name: bela_escala_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mestre_escala_2026}
      POSTGRES_DB: bela_escala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bela_escala"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bela-net

  # Backend - espera o banco estar saudável
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bela_escala_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:mestre_escala_2026@db:5432/bela_escala?schema=public
      JWT_SECRET: ${JWT_SECRET:-bela-escala-jwt-secret-production-key-2026}
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Migration e Seed rodam ANTES de iniciar o app
    command: >
      sh -c "npx prisma migrate deploy && 
             npx prisma db seed && 
             npm start"
    networks:
      - bela-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bela_escala_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bela-net

  # MinIO Storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bela_escala_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bela-net

  # Nginx Proxy Manager - SSL e Domínios
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: bela_escala_proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - bela-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  npm_data:
  npm_letsencrypt:

networks:
  bela-net:
    driver: bridge
  redis:
    image: redis:7-alpine
    container_name: bela-escala-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bela-net

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bela-escala-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bela-net

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: bela-escala-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - bela-net

networks:
  bela-net:
    driver: bridge

volumes:
  db_data:
  vector_data:
  redis_data:
  minio_data:
  npm_data:
  npm_letsencrypt:
