version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: bela_escala_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mestre_escala_2026}
      POSTGRES_DB: bela_escala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bela_escala"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bela-net

  # Backend API
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bela_escala_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:mestre_escala_2026@db:5432/bela_escala?schema=public
      JWT_SECRET: ${JWT_SECRET:-bela-escala-jwt-secret-production-key-2026}
      NODE_ENV: production
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma db push --skip-generate && 
             npx prisma db seed && 
             npm start"
    networks:
      - bela-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bela_escala_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bela-net

  # MinIO S3 Storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bela_escala_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bela-net

  # Nginx Proxy Manager (SSL + Domain)
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: bela_escala_proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - bela-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  npm_data:
  npm_letsencrypt:

networks:
  bela-net:
    driver: bridge
